[package]
name = "singularity"
version = "0.1.0"
edition = "2024"
description = "Single File Backend"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
thiserror = "2.0"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
rhai = { version = "1.21", features = ["sync"] }
rusqlite = { version = "0.34", features = ["bundled"] }
